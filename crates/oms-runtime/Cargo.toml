[package]
name = "oms-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
std = ["oms-types/std", "dep:im", "dep:nix"]

[dependencies]
im = { version = "15.1.0", default-features = false, optional = true }
nix = { version = "0.30", features = ["signal"], optional = true }
oms-shard = { path = "../oms-shard" }
oms-types = { path = "../oms-types", default-features = false }

[lints]
workspace = true
